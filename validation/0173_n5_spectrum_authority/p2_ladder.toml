coordinate_transform = "C=inv(cholesky(K).U); theta=C*phi; C'*K*C=I; Q_phi=Q'*C"
direct_rank_one_check = "diagnostic accumulates each nonzero-supported Q column's signed scale times q*q' into H_theta, then forms C'*H_theta*C; this mirrors the package helper's accumulation order and checks formula/input-path agreement, not an independent physical oracle"
fixed_input_reduction_order_sensitivity = "hold the frozen Float64 C, Qtilde, Ltilde, common log scale, and underflow floor fixed; compare the source forward column order with reverse column order, ascending-magnitude per-entry term reduction, and right-associated dense whitening multiplication, then report each scaled matrix/eigenspectrum change"
float64_canonical_matrix = "source leading_hessian_matrix_float64_scaled(C,Ltilde,Qtilde), with its common scale recorded and restored in mass conversion"
independent_metric_cross_check = "recompute C_K=inv(cholesky(K_high_precision).U), solve C_K'*H_theta*C_K, and evaluate the generalized H_theta*v=lambda*K*v residuals; this checks the metric transform independently from C converted from Float64"
normwise_generalized_residual = "||H_theta*v-lambda*K*v||_2/(||H_theta||_2*||v||_2+abs(lambda)*||K||_2*||v||_2); 2-norms and theta coordinates"
normwise_whitened_residual = "||W*u-lambda*u||_2/(||W||_2*||u||_2+abs(lambda)*||u||_2); 2-norms and canonical whitened coordinates"
precision_conversion = "frozen Float64 C and Ltilde entries are promoted directly to ArbFloat; round-trip equality verifies input preservation, while the separately recorded shortest-decimal expansion gap is not a conversion-error estimate"

