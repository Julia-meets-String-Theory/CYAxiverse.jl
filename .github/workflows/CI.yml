name: CI

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
    paths:
      - 'src/**'
      - 'ext/**'
      - 'test/**'
      - 'scripts/**'
      - 'add_functions/**'
      - 'jlm_python/**'
      - 'docs/Project.toml'
      - 'docs/Manifest.toml'
      - 'docs/make.jl'
      - 'bin/**'
      - 'Project.toml'
      - 'Manifest.toml'
      - 'iterations.toml'
      - '.github/workflows/CI.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  lifecycle:
    name: Version lifecycle checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Install documentation routing test dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Check lifecycle, version, and documentation routing fixtures
        run: |
          python3 -m unittest discover -s scripts -p 'test_version_lifecycle_*.py'
          python3 -m unittest discover -s scripts -p 'test_check_version_bump.py'
          python3 -m unittest discover -s scripts -p 'test_documentation_routing.py'

  fast:
    name: Fast tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CYAXIVERSE_TEST_FULL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
          arch: x64
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  full:
    name: Full test suite
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    env:
      CYAXIVERSE_TEST_FULL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check package version bump
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: python3 scripts/check_version_bump.py --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --require-bump
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
          arch: x64
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run package tests
        uses: julia-actions/julia-runtest@v1
      - name: Job summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          | Field | Value |
          |-------|-------|
          | Julia | 1.12 |
          | Runner | ubuntu-latest-x64 |
          | Event | ${{ github.event_name }} |
          | Commit | \`${{ github.sha }}\` |
          | Status | \`${{ job.status }}\` |
          EOF
