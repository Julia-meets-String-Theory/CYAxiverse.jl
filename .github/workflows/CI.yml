name: CI

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'src/**'
      - 'ext/**'
      - 'test/**'
      - 'scripts/**'
      - 'notebooks/**'
      - 'add_functions/**'
      - 'jlm_python/**'
      - 'docs/Project.toml'
      - 'docs/Manifest.toml'
      - 'docs/make.jl'
      - 'bin/**'
      - 'Project.toml'
      - 'Manifest.toml'
      - 'iterations.toml'
      - '.github/workflows/CI.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  lifecycle:
    name: Version lifecycle checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Install documentation routing test dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Check lifecycle, version, and documentation routing fixtures
        run: |
          python3 -m unittest discover -s scripts -p 'test_version_lifecycle_*.py'
          python3 -m unittest discover -s scripts -p 'test_check_version_bump.py'
          python3 -m unittest discover -s scripts -p 'test_documentation_routing.py'

  fast:
    name: Fast tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CYAXIVERSE_TEST_FULL: '0'
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
          arch: x64
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Instantiate notebook environment
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: |
          julia --startup-file=no --project=notebooks -e 'using Pkg; Pkg.instantiate()'
          git diff --exit-code -- notebooks/Project.toml notebooks/Manifest.toml
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false

  cytools-bridge:
    name: CYTools bridge tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
          arch: x64
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      # PyCall is only a weak dependency of the package, so the Fast job cannot
      # see it and skips the CYTools initialization smokes. Install it in the
      # default environment against the runner's Python; the smokes use a stub
      # CYTools package and never need a real CYTools or MOSEK installation.
      - name: Install PyCall against the runner's Python
        run: |
          export PYTHON="$(command -v python)"
          julia --startup-file=no -e 'using Pkg; Pkg.add("PyCall"); Pkg.build("PyCall")'
      - name: Run CYTools initialization tests with PyCall visible
        run: |
          julia --startup-file=no --project=. -e '
            using Test, CYAxiverse
            Base.find_package("PyCall") === nothing &&
                error("PyCall is not visible, so the CYTools smokes would be skipped")
            include("test/cytools_initialization.jl")'

  full:
    name: Full test suite
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'full-tests')
    runs-on: ubuntu-latest
    env:
      CYAXIVERSE_TEST_FULL: '1'
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check package version bump
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: python3 scripts/check_version_bump.py --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --require-bump
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
          arch: x64
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Instantiate notebook environment
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: |
          julia --startup-file=no --project=notebooks -e 'using Pkg; Pkg.instantiate()'
          git diff --exit-code -- notebooks/Project.toml notebooks/Manifest.toml
      - name: Run package tests
        uses: julia-actions/julia-runtest@v1
      - name: Job summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          | Field | Value |
          |-------|-------|
          | Julia | 1.12 |
          | Runner | ubuntu-latest-x64 |
          | Event | ${{ github.event_name }} |
          | Commit | \`${{ github.sha }}\` |
          | Status | \`${{ job.status }}\` |
          EOF
