name: Wiki refresh checks

on:
  pull_request:
    branches: [vmm]
    paths:
      - "wiki/**"
      - "scripts/wiki_refresh.jl"
      - ".github/workflows/WikiRefresh.yml"
      - "specs/0183-wiki-refresh-v1/**"
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Instantiate and test wiki tooling
        run: |
          julia --project=wiki -e 'using Pkg; Pkg.instantiate(); Pkg.test()'

      - name: Verify tracked public sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          julia --project=wiki scripts/wiki_refresh.jl verify

  drift:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Instantiate wiki tooling
        run: julia --project=wiki -e 'using Pkg; Pkg.instantiate()'

      - name: Read-only wiki drift check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: julia --project=wiki scripts/wiki_refresh.jl check
