name: CYAx lifecycle dispatch

on:
  push:
    branches:
      - rehearsal/trigger/*
    paths:
      - lifecycle-requests/**

permissions: {}

jobs:
  lifecycle:
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && github.ref_type == 'branch' && startsWith(github.ref, 'refs/heads/rehearsal/trigger/') && github.event.sender.type == 'User' && github.event.sender.login == github.actor && github.actor != 'cyaxiverse-lifecycle[bot]' && github.event.installation.id != 172789630 }}
    name: Validate and fence an Owner rehearsal request
    environment:
      name: lifecycle
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch the exact trigger commit with anonymous read-only access
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          set +x
          git init --quiet "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/Julia-meets-String-Theory/CYAxiverse.jl.git"
          mkdir -p "$RUNNER_TEMP/cyax125-anonymous-home"
          env -i \
            PATH="$PATH" \
            HOME="$RUNNER_TEMP/cyax125-anonymous-home" \
            GIT_CONFIG_NOSYSTEM=1 \
            GIT_CONFIG_GLOBAL=/dev/null \
            GIT_CONFIG_COUNT=3 \
            GIT_CONFIG_KEY_0=credential.helper \
            GIT_CONFIG_VALUE_0= \
            GIT_CONFIG_KEY_1=core.hooksPath \
            GIT_CONFIG_VALUE_1=/dev/null \
            GIT_CONFIG_KEY_2=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_2= \
            GIT_TERMINAL_PROMPT=0 \
            GCM_INTERACTIVE=Never \
              git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=2 origin "$GITHUB_REF"
          env -i \
            PATH="$PATH" \
            HOME="$RUNNER_TEMP/cyax125-anonymous-home" \
            GIT_CONFIG_NOSYSTEM=1 \
            GIT_CONFIG_GLOBAL=/dev/null \
            GIT_CONFIG_COUNT=3 \
            GIT_CONFIG_KEY_0=credential.helper \
            GIT_CONFIG_VALUE_0= \
            GIT_CONFIG_KEY_1=core.hooksPath \
            GIT_CONFIG_VALUE_1=/dev/null \
            GIT_CONFIG_KEY_2=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_2= \
            GIT_TERMINAL_PROMPT=0 \
            GCM_INTERACTIVE=Never \
              git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=8 origin \
                f12fbb8ec52e4c7510564f602a15f26173fe772e \
                a6df7c78e27ee81771cc06b0783a508edcaed320 \
                32af89296955ad684517e7a57ce5d8a431f5a971 \
                749c211debb344d556db5a1f74e6759a217fe9da
          git -C "$GITHUB_WORKSPACE" checkout --quiet --detach "$GITHUB_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - id: approval
        name: Validate exact route and approval evidence before App mint
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=scripts python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import sys
          from version_lifecycle.github_protection import (
              GitHubProtectionError, validate_rehearsal_trigger,
          )
          from version_lifecycle.rehearsal import (
              RehearsalError, verify_run_approval,
              validate_rehearsal_route_trigger,
          )

          with Path(os.environ["GITHUB_EVENT_PATH"]).open(encoding="utf-8") as stream:
              event = json.load(stream)
          context = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "ref": os.environ["GITHUB_REF"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "actor": os.environ["GITHUB_ACTOR"],
              "event": event,
          }
          try:
              route_request = validate_rehearsal_route_trigger(Path.cwd(), **context)
          except (RehearsalError, GitHubProtectionError):
              legacy_request = validate_rehearsal_trigger(Path.cwd(), **context)
              with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
                  output.write("route_mode=false\n")
              print(json.dumps({"status": "LEGACY_REQUEST_FENCE_ONLY", "request_id": legacy_request.request_id}))
              raise SystemExit(0)

          try:
              approval = verify_run_approval(
                  route_request,
                  run_id=int(os.environ["GITHUB_RUN_ID"]),
                  run_attempt=int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  head_sha=os.environ["GITHUB_SHA"],
                  ref=os.environ["GITHUB_REF"],
              )
              raw_envelope = {
                  "schema_version": 1,
                  "receipt_b64": base64.b64encode(approval.receipt_bytes).decode("ascii"),
                  "receipt_sha256": approval.receipt_sha256,
                  "responses": [
                      {
                          "path": item["path"],
                          "status": item["status"],
                          "headers": dict(item["headers"]),
                          "body_b64": base64.b64encode(item["body"]).decode("ascii"),
                          "body_sha256": item["body_sha256"],
                      }
                      for item in approval.raw_responses
                  ],
              }
              raw_path = Path(os.environ["RUNNER_TEMP"]) / "cyax125-approval-raw.json"
              raw_path.write_text(json.dumps(raw_envelope, sort_keys=True, separators=(",", ":")), encoding="ascii")
              with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
                  output.write("route_mode=true\n")
                  output.write("approval_receipt_b64=" + base64.b64encode(approval.receipt_bytes).decode("ascii") + "\n")
              # The adopted request contains only the seed receipt digest, not
              # parseable Owner receipts. Do not reach the secret-bearing step.
              raise RehearsalError("OWNER_SEED_RECEIPTS_UNAVAILABLE_BEFORE_APP_MINT")
          except RehearsalError as error:
              print(error.reason)
              sys.exit(1)
          PY

      - name: Mint a scoped token and execute the fixed rehearsal route
        env:
          LIFECYCLE_APP_ID: ${{ vars.LIFECYCLE_APP_ID }}
          LIFECYCLE_APP_PRIVATE_KEY: ${{ secrets.LIFECYCLE_APP_PRIVATE_KEY }}
          ROUTE_MODE: ${{ steps.approval.outputs.route_mode }}
          APPROVAL_RECEIPT_B64: ${{ steps.approval.outputs.approval_receipt_b64 }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          set +x
          ruby <<'RUBY'
          require "base64"
          require "json"
          require "net/http"
          require "open3"
          require "openssl"
          require "time"
          require "uri"

          API_ORIGIN = "https://api.github.com"
          API_VERSION = "2026-03-10"
          INSTALLATION_ID = 172789630
          REPOSITORY = "Julia-meets-String-Theory/CYAxiverse.jl"

          def api_json(method, path, bearer, body = nil)
            uri = URI("#{API_ORIGIN}#{path}")
            request = case method
                      when :post then Net::HTTP::Post.new(uri)
                      when :get then Net::HTTP::Get.new(uri)
                      else raise "API_METHOD_INVALID"
                      end
            request["Accept"] = "application/vnd.github+json"
            request["Authorization"] = "Bearer #{bearer}"
            request["X-GitHub-Api-Version"] = API_VERSION
            request["Content-Type"] = "application/json"
            request.body = JSON.generate(body) if body
            response = Net::HTTP.start(
              uri.host, uri.port, use_ssl: true, open_timeout: 10, read_timeout: 20
            ) { |http| http.request(request) }
            raise "GITHUB_API_REJECTED" unless response.code.to_i.between?(200, 299)
            response.body.empty? ? {} : JSON.parse(response.body)
          rescue OpenSSL::SSL::SSLError, IOError, JSON::ParserError, Net::OpenTimeout,
                 Net::ReadTimeout, SocketError, SystemCallError
            raise "GITHUB_API_UNAVAILABLE"
          end

          def base64url(value)
            Base64.urlsafe_encode64(value, padding: false)
          end

          begin
            preflight_python = <<~PY
              import base64
              import json
              import os
              from pathlib import Path
              from version_lifecycle.github_protection import (
                  validate_rehearsal_trigger,
              )
              from version_lifecycle.rehearsal import (
                  RehearsalError, validate_rehearsal_route_trigger,
                  validate_approval_receipt,
              )
              with Path(os.environ["GITHUB_EVENT_PATH"]).open(encoding="utf-8") as stream:
                  event = json.load(stream)
              context = {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "ref": os.environ["GITHUB_REF"],
                  "commit_sha": os.environ["GITHUB_SHA"],
                  "actor": os.environ["GITHUB_ACTOR"],
                  "event": event,
              }
              if os.environ.get("ROUTE_MODE") == "true":
                  request = validate_rehearsal_route_trigger(Path.cwd(), **context)
                  receipt = base64.b64decode(
                      os.environ["APPROVAL_RECEIPT_B64"], validate=True
                  )
                  validate_approval_receipt(
                      receipt, request, run_id=int(os.environ["GITHUB_RUN_ID"]),
                      run_attempt=int(os.environ["GITHUB_RUN_ATTEMPT"]),
                      head_sha=os.environ["GITHUB_SHA"],
                  )
                  raise RehearsalError("OWNER_SEED_RECEIPTS_UNAVAILABLE_BEFORE_APP_MINT")
              validate_rehearsal_trigger(Path.cwd(), **context)
            PY
            preflight_environment = {
              "GITHUB_ACTOR" => ENV.fetch("GITHUB_ACTOR"),
              "GITHUB_REF" => ENV.fetch("GITHUB_REF"),
              "GITHUB_SHA" => ENV.fetch("GITHUB_SHA"),
              "GITHUB_REPOSITORY" => ENV.fetch("GITHUB_REPOSITORY"),
              "GITHUB_EVENT_PATH" => ENV.fetch("GITHUB_EVENT_PATH"),
              "GITHUB_RUN_ID" => ENV.fetch("GITHUB_RUN_ID"),
              "GITHUB_RUN_ATTEMPT" => ENV.fetch("GITHUB_RUN_ATTEMPT"),
              "ROUTE_MODE" => ENV.fetch("ROUTE_MODE", "false"),
              "APPROVAL_RECEIPT_B64" => ENV.fetch("APPROVAL_RECEIPT_B64", ""),
              "PYTHONPATH" => "scripts",
              "PYTHONDONTWRITEBYTECODE" => "1",
            }
            _preflight_out, _preflight_err, preflight_status = Open3.capture3(
              preflight_environment, "python3", "-c", preflight_python,
              unsetenv_others: true
            )
            raise "TRIGGER_OR_RECEIPT_REVALIDATION_FAILED" unless preflight_status.success?
            app_id = ENV.fetch("LIFECYCLE_APP_ID")
            raise "APP_ID_INVALID" unless app_id.match?(/\A[0-9]+\z/)
            raise "APP_ID_MISMATCH" unless app_id == "5371554"
            private_key = OpenSSL::PKey::RSA.new(
              ENV.fetch("LIFECYCLE_APP_PRIVATE_KEY")
            )
            now = Time.now.to_i
            signing_input = [
              base64url(JSON.generate({ "alg" => "RS256", "typ" => "JWT" })),
              base64url(JSON.generate({
                "iat" => now - 60, "exp" => now + 540, "iss" => app_id
              })),
            ].join(".")
            jwt = "#{signing_input}.#{base64url(private_key.sign(OpenSSL::Digest::SHA256.new, signing_input))}"
            token_record = api_json(
              :post,
              "/app/installations/#{INSTALLATION_ID}/access_tokens",
              jwt,
              {
                "repositories" => ["CYAxiverse.jl"],
                "permissions" => {
                  "contents" => "write", "metadata" => "read"
                },
              },
            )
            token = token_record["token"]
            expires_at = Time.parse(token_record.fetch("expires_at"))
            raise "APP_TOKEN_SCOPE_INVALID" unless
              token.is_a?(String) &&
              token_record["permissions"] == {
                "contents" => "write", "metadata" => "read"
              } &&
              expires_at > Time.now && expires_at <= Time.now + 3600
            installed = api_json(
              :get, "/installation/repositories?per_page=100", token
            )
            repositories = installed.fetch("repositories").map {
              |row| row.fetch("full_name")
            }
            raise "APP_TOKEN_REPOSITORY_SCOPE_INVALID" unless
              installed["total_count"] == 1 && repositories == [REPOSITORY]

            python = <<~PY
              import base64
              from datetime import datetime
              import json
              import os
              from pathlib import Path
              from version_lifecycle.github_protection import (
                  GitHubProtectionAdapter,
                  validate_rehearsal_trigger,
              )
              from version_lifecycle.rehearsal import (
                  validate_rehearsal_route_trigger, validate_approval_receipt,
                  run_rehearsal,
              )

              with Path(os.environ["GITHUB_EVENT_PATH"]).open(encoding="utf-8") as stream:
                  event = json.load(stream)
              context = {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "ref": os.environ["GITHUB_REF"],
                  "commit_sha": os.environ["GITHUB_SHA"],
                  "actor": os.environ["GITHUB_ACTOR"],
                  "event": event,
              }
              route_mode = os.environ.get("ROUTE_MODE") == "true"
              if route_mode:
                  request = validate_rehearsal_route_trigger(Path.cwd(), **context)
                  receipt = base64.b64decode(
                      os.environ["APPROVAL_RECEIPT_B64"], validate=True
                  )
                  approval = validate_approval_receipt(
                      receipt, request, run_id=int(os.environ["GITHUB_RUN_ID"]),
                      run_attempt=int(os.environ["GITHUB_RUN_ATTEMPT"]),
                      head_sha=os.environ["GITHUB_SHA"],
                  )
              else:
                  request = validate_rehearsal_trigger(Path.cwd(), **context)
              intent = {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "request_id": request.request_id,
                  "owner_environment_approved": True,
              }
              adapter = GitHubProtectionAdapter(
                  os.environ["GITHUB_REPOSITORY"],
                  token=os.environ["GH_TOKEN"],
                  repository_path=Path.cwd(),
                  token_permissions={"contents": "write", "metadata": "read"},
                  token_expires_at=datetime.fromisoformat(
                      os.environ["APP_TOKEN_EXPIRES_AT"].replace("Z", "+00:00")
                  ),
                  rehearsal_gate=lambda item, action, ref, rules: (
                      action == (
                          "create-route-request-fence" if route_mode
                          else "create-request-fence"
                      )
                      and item.get("owner_environment_approved") is True
                      and item.get("request_id") == request.request_id
                      and rules.get("repository") == os.environ["GITHUB_REPOSITORY"]
                      and rules.get("ref") == ref
                      and rules.get("policy") == "cyax-r15-rehearsal-request-fence-v1"
                      and adapter.is_live_rehearsal_rules_evidence(
                          rules, ref=ref, policy="request-fence"
                      )
                  ),
              )
              if route_mode:
                  fence = adapter.create_rehearsal_route_request_fence(
                      request, approval=approval, intent=intent
                  )
                  result = run_rehearsal(request, approval, adapter, adapter)
                  print(json.dumps({"fence": fence, "result": result}, sort_keys=True))
              else:
                  result = adapter.create_rehearsal_request_fence(request, intent=intent)
                  print(json.dumps(result, sort_keys=True))
            PY
            child_environment = {
              "GH_TOKEN" => token,
              "GITHUB_ACTOR" => ENV.fetch("GITHUB_ACTOR"),
              "GITHUB_REF" => ENV.fetch("GITHUB_REF"),
              "GITHUB_SHA" => ENV.fetch("GITHUB_SHA"),
              "GITHUB_REPOSITORY" => ENV.fetch("GITHUB_REPOSITORY"),
              "GITHUB_EVENT_PATH" => ENV.fetch("GITHUB_EVENT_PATH"),
              "GITHUB_RUN_ID" => ENV.fetch("GITHUB_RUN_ID"),
              "GITHUB_RUN_ATTEMPT" => ENV.fetch("GITHUB_RUN_ATTEMPT"),
              "ROUTE_MODE" => ENV.fetch("ROUTE_MODE", "false"),
              "APPROVAL_RECEIPT_B64" => ENV.fetch("APPROVAL_RECEIPT_B64", ""),
              "APP_TOKEN_EXPIRES_AT" => expires_at.utc.iso8601,
              "PYTHONPATH" => "scripts",
              "PYTHONDONTWRITEBYTECODE" => "1",
            }
            stdout, _stderr, status = Open3.capture3(
              child_environment, "python3", "-c", python, unsetenv_others: true
            )
            raise "REQUEST_FENCE_FAILED" unless status.success?
            puts stdout
          rescue OpenSSL::PKey::RSAError
            abort "APP_PRIVATE_KEY_INVALID"
          rescue KeyError
            abort "TOKEN_RESPONSE_INVALID"
          rescue StandardError => error
            allowed = %w[
              API_METHOD_INVALID APP_ID_INVALID APP_ID_MISMATCH
              APP_TOKEN_SCOPE_INVALID APP_TOKEN_REPOSITORY_SCOPE_INVALID
              GITHUB_API_REJECTED GITHUB_API_UNAVAILABLE REQUEST_FENCE_FAILED
            ]
            abort(allowed.include?(error.message) ? error.message : "TOKEN_OR_FENCE_FAILED")
          end
          RUBY
