name: Documentation

on:
  push:
    branches: [vmm]
    tags: 'v*.*.*'
    paths:
      - 'docs/src/**'
      - 'docs/make.jl'
      - 'docs/verify_release_context.py'
      - 'docs/Project.toml'
      - 'src/**'
      - 'ext/**'
      - 'Project.toml'
      - '.github/workflows/Documentation.yml'
  pull_request:
    paths:
      - 'docs/src/**'
      - 'docs/make.jl'
      - 'docs/verify_release_context.py'
      - 'docs/Project.toml'
      - 'src/**'
      - 'ext/**'
      - 'Project.toml'
      - '.github/workflows/Documentation.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Fetch immutable lifecycle authority
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin 'refs/heads/lifecycle/v1/*:refs/remotes/origin/lifecycle/v1/*'
          RELEASE_REF="refs/remotes/origin/lifecycle/v1/releases/${GITHUB_REF_NAME}"
          if ! git show "$RELEASE_REF:manifest.json" > "$RUNNER_TEMP/released-manifest.json"; then
            echo "matching immutable released manifest is unavailable" >&2
            exit 2
          fi
          python3 - "$RUNNER_TEMP/released-manifest.json" "$RUNNER_TEMP/publication-ref" <<'PY'
          import json
          import pathlib
          import sys
          from hashlib import sha256
          sys.path.insert(0, "scripts")
          from version_lifecycle.manifests import publication_ref
          released = json.loads(pathlib.Path(sys.argv[1]).read_text())
          pathlib.Path(sys.argv[2]).write_text(
              publication_ref(released["public_tag"], released["manifest_id"])
          )
          PY
          PUBLICATION_REF="refs/remotes/origin/$(cat "$RUNNER_TEMP/publication-ref" | sed 's#refs/heads/##')"
          if ! git show "$PUBLICATION_REF:manifest.json" > "$RUNNER_TEMP/publication-manifest.json"; then
            echo "matching immutable publication manifest is unavailable" >&2
            exit 2
          fi
          python3 - "$RUNNER_TEMP/publication-manifest.json" "$RUNNER_TEMP/publication-evidence-ref" <<'PY'
          import json
          import pathlib
          import sys
          publication = json.loads(pathlib.Path(sys.argv[1]).read_text())
          evidence_ref = publication["publication_evidence_ref"]
          parts = pathlib.PurePosixPath(evidence_ref).parts
          if (
              not isinstance(evidence_ref, str)
              or not parts
              or evidence_ref.startswith("/")
              or any(part in {"", ".", ".."} for part in parts)
              or "\\" in evidence_ref
              or ":" in evidence_ref
          ):
              raise SystemExit("unsafe publication evidence ref")
          pathlib.Path(sys.argv[2]).write_text(evidence_ref)
          PY
          PUBLICATION_EVIDENCE_REF="$(cat "$RUNNER_TEMP/publication-evidence-ref")"
          if ! git show "$GITHUB_REF:$PUBLICATION_EVIDENCE_REF" > "$RUNNER_TEMP/publication-evidence"; then
            echo "immutable publication evidence is unavailable from the release tag" >&2
            exit 2
          fi
      - name: Verify immutable release context for tag documentation
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 docs/verify_release_context.py \
            --manifest "$RUNNER_TEMP/released-manifest.json" \
            --publication-manifest "$RUNNER_TEMP/publication-manifest.json" \
            --publication-evidence "$RUNNER_TEMP/publication-evidence" \
            --tag-ref "$GITHUB_REF" \
            --tag "$GITHUB_REF_NAME" \
            --tag-sha "$(git rev-parse "${GITHUB_REF}^{commit}")" \
            --tag-tree "$(git rev-parse "${GITHUB_REF}^{tree}")" \
            --tag-version "$(git show "${GITHUB_REF}:Project.toml" | sed -n 's/^version = \"\(.*\)\"/\1/p')" \
            --main-sha "$(git rev-parse refs/remotes/origin/main^{commit})" \
            --main-version "$(git show refs/remotes/origin/main:Project.toml | sed -n 's/^version = \"\(.*\)\"/\1/p')" \
            --github-release-id "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq .id)" \
            --github-env "$GITHUB_ENV"
      - name: Verify development documentation context
        if: github.ref == 'refs/heads/vmm'
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          python3 docs/verify_release_context.py \
            --stable-only \
            --main-sha "$(git rev-parse refs/remotes/origin/main^{commit})" \
            --main-version "$(git show refs/remotes/origin/main:Project.toml | sed -n 's/^version = \"\(.*\)\"/\1/p')" \
            --github-env "$GITHUB_ENV"
      - name: Install dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build documentation
        if: github.event_name == 'pull_request'
        env:
          DOCS_DEPLOY: 'false'
          CYAX_DOCS_REF: ${{ github.ref }}
          CYAX_DOCS_MANIFEST_STATUS: 'preview'
        run: julia --project=docs/ docs/make.jl
      - name: Build and deploy documentation
        if: github.event_name != 'pull_request'
        env:
          DOCS_DEPLOY: 'true'
          CYAX_DOCS_REF: ${{ github.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs/ docs/make.jl
