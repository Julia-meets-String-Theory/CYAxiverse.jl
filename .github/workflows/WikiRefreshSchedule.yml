name: CYAxiverse wiki drift schedule

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/WikiRefreshSchedule.yml"
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate-definition:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Confirm scheduler targets vmm
        shell: bash
        run: |
          grep -q 'ref: vmm' .github/workflows/WikiRefreshSchedule.yml
          grep -q 'scripts/wiki_refresh.jl check' .github/workflows/WikiRefreshSchedule.yml

  drift:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current vmm
        uses: actions/checkout@v5
        with:
          ref: vmm

      - name: Probe wiki refresh availability
        id: probe
        shell: bash
        run: |
          if [[ -f wiki/Project.toml && -f scripts/wiki_refresh.jl ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "CYAxiverse wiki refresh tool is not yet present on vmm; scheduler is installed but inactive."
          fi

      - uses: julia-actions/setup-julia@v2
        if: steps.probe.outputs.available == 'true'
        with:
          version: "1.12"

      - name: Instantiate wiki tooling
        if: steps.probe.outputs.available == 'true'
        run: julia --project=wiki -e 'using Pkg; Pkg.instantiate()'

      - name: Verify tracked sources and state
        if: steps.probe.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: julia --project=wiki scripts/wiki_refresh.jl verify

      - name: Read-only wiki drift check
        if: steps.probe.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: julia --project=wiki scripts/wiki_refresh.jl check
